name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify.sh
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./...
          staticcheck ./...
          $unreachable = go run golang.org/x/tools/cmd/deadcode@v0.41.0 ./cmd/dl
          if ($unreachable) { throw "unreachable code:`n$unreachable" }
          go test -race -count=1 ./cmd/... ./internal/...
          go test -race -count=3 ./test/e2e
          $env:CGO_ENABLED = "0"
          $outBin = Join-Path $env:RUNNER_TEMP "dl.exe"
          go build -trimpath -o $outBin ./cmd/dl
